name: Export MOVNET source archive

on:
  push:
    paths:
      - ".github/workflows/export-movnet-archive.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate archive
        run: |
          test -f MOVNET_0.8.0_MP4_test.zip
          unzip -l MOVNET_0.8.0_MP4_test.zip > archive-manifest.txt
          mkdir -p archive-export
          cp MOVNET_0.8.0_MP4_test.zip archive-export/

      - name: Upload original archive and manifest
        uses: actions/upload-artifact@v4
        with:
          name: movnet-080-source-archive
          path: |
            archive-export/MOVNET_0.8.0_MP4_test.zip
            archive-manifest.txt
          retention-days: 3
