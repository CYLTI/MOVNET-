name: Build MOVNET APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: |
          unzip -q MOVNET_0.8.0_MP4_test.zip -d extracted

          PROJECT_DIR="$(find extracted -type f -path '*/app/build.gradle.kts' -print -quit | sed 's|/app/build.gradle.kts$||')"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found in ZIP"
            exit 1
          fi

          cp -a "$PROJECT_DIR"/. .

      - name: Align JVM targets
        run: |
          sed -i '/^android {/a\
              compileOptions {\
                  sourceCompatibility = JavaVersion.VERSION_17\
                  targetCompatibility = JavaVersion.VERSION_17\
              }' app/build.gradle.kts

      - name: Build APK
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: MOVNET-APK
          path: app/build/outputs/apk/debug/app-debug.apk
