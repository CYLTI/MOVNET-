name: Prepare MOVNET 0.9.0

on:
  push:
    branches: ["release/0.9.0"]
    paths:
      - ".github/workflows/prepare-release.yml"

permissions:
  contents: write

jobs:
  prepare-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/0.9.0

      - name: Extract project source
        run: |
          unzip -q MOVNET_0.8.0_MP4_test.zip -d /tmp/movnet-source
          PROJECT_DIR="$(find /tmp/movnet-source -type f -path '*/app/build.gradle.kts' -print -quit | sed 's|/app/build.gradle.kts$||')"
          test -n "$PROJECT_DIR"
          cp -a "$PROJECT_DIR"/. .

      - name: Apply 0.9.0 fixes and clean archive
        run: python .github/scripts/prepare_release.py

      - name: Commit extracted source tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Prepare MOVNET 0.9.0 source release"
            git push origin HEAD:release/0.9.0
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon -PMOVNET_API_BASE_URL="${{ vars.MOVNET_API_BASE_URL }}" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MOVNET-0.9.0-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
